[mypy]
python_version = 3.14
strict = True
plugins = pydantic.mypy
files = tests, examples, scripts, tools, research
# A reference implementation, a reproduction's or an integration's, runs in
# an environment of its own, with its own packages, apart from the
# repository's.
exclude = research/[^/]+/[^/]+/reference/

# scipy ships no types; the Vanthoor reproduction calls only solve_ivp and
# reads its result.
[mypy-scipy.*]
ignore_missing_imports = True
