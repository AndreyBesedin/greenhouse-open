[mypy]
python_version = 3.14
strict = True
plugins = pydantic.mypy
files = tests, examples, scripts, tools, research
# A reproduction's reference runs in an environment of its own, with its
# own packages, apart from the repository's.
exclude = research/reproductions/[^/]+/reference/

# scipy ships no types; the Vanthoor reproduction calls only solve_ivp and
# reads its result.
[mypy-scipy.*]
ignore_missing_imports = True
