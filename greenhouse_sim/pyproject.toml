[project]
name = "greenhouse-sim"
version = "0.3.0"
description = "A deterministic greenhouse simulator that produces canonical observations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "greenhouse-protocol>=0.3.0,<0.4",
    "pydantic>=2.12.2",
    "numpy>=2.0",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# A range is written as a number line (`low < value < high`), and a named
# constant is compared with the number it should be: SIM300 would turn
# both around.
ignore = ["SIM300"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["greenhouse_sim", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: slower tests excluded from the pre-commit fast pass",
    "cfd: runs OpenFOAM, natively or in Docker; only with -m cfd, and skipped without it",
]
