<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>greenhouse-sim viewer</title>
    <link rel="icon" href="data:," />
    <script>
      // The theme chosen in this browser, else the system's, as design/theme.ts
      // reads it, on the document before anything is drawn: the stylesheet's
      // color-scheme follows it, so that a dark page never opens white.
      // main.tsx sets it again.
      try {
        const chosen = localStorage.getItem("greenhouse-sim.panels");
        document.documentElement.dataset.theme =
          chosen === "light" || chosen === "dark"
            ? chosen
            : window.matchMedia?.("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
