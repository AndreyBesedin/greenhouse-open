name: Pull request risk

# Separate from CI so that editing the pull request description, which is
# where the manual-review acknowledgement is given, re-runs only this gate
# and evaluates the description and base branch as they are now. Re-running
# an earlier run would not: a re-run replays the event that started it,
# including the description and base commit it saw then.
#
# On a Dependabot pull request a maintainer's approval of its latest commit
# is the acknowledgement (decision 0034), read here as the reviews stand;
# pr-risk-review.yml re-runs this gate when one is submitted.
#
# Its description also gives its changelog entry, or none (decision 0056),
# which the release takes: checked here for the same reason, so that
# editing the description checks it again.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-risk:
    name: pull request risk gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Read a Dependabot pull request's reviews
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --paginate
          "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews?per_page=100"
          --jq '.[] | {user: .user.login, state, commit_id, author_association}'
          > "$RUNNER_TEMP/reviews.jsonl"

      - name: Classify review risk
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_REVIEWS: ${{ runner.temp }}/reviews.jsonl
        run: >-
          python scripts/check_pr_risk.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  pr-changelog:
    name: pull request changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Read its changelog entry
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_IS_BOT: ${{ github.event.pull_request.user.type == 'Bot' }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python scripts/release.py check-description
