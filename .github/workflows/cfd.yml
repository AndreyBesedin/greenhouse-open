name: CFD

# Runs OpenFOAM, in its container, on changes that can change what it is
# given or how its solution is read (decision 0027). The tests that need it
# compare a fresh solve with the result kept in the repository; the result
# solved here is kept as an artifact, from which a kept result that went
# stale is taken.
on:
  push:
    branches: [main]
    paths:
      - "greenhouse_sim/greenhouse_sim/cfd/**"
      - "greenhouse_sim/greenhouse_sim/fields/**"
      - "greenhouse_sim/greenhouse_sim/scenarios/**"
      - "greenhouse_sim/greenhouse_sim/world/**"
      - "greenhouse_sim/tests/conftest.py"
      - "greenhouse_sim/tests/test_cfd_*.py"
      - ".github/workflows/cfd.yml"
  pull_request:
    paths:
      - "greenhouse_sim/greenhouse_sim/cfd/**"
      - "greenhouse_sim/greenhouse_sim/fields/**"
      - "greenhouse_sim/greenhouse_sim/scenarios/**"
      - "greenhouse_sim/greenhouse_sim/world/**"
      - "greenhouse_sim/tests/conftest.py"
      - "greenhouse_sim/tests/test_cfd_*.py"
      - ".github/workflows/cfd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openfoam:
    name: OpenFOAM meshes and solves the reference cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Editable, so that a solve keeps its result where the repository does.
      - name: Install the simulator and its tests' tools
        run: >-
          python -m pip install
          -e ./greenhouse_protocol -e ./greenhouse_sim
          -r requirements-dev.txt

      # The image the runner names, by digest: the kept results are what it
      # solves.
      - name: Pull OpenFOAM's container
        run: docker pull "$(python -c 'from greenhouse_sim.cfd.runner import DEFAULT_IMAGE; print(DEFAULT_IMAGE)')"

      - name: Run the tests that run OpenFOAM
        working-directory: greenhouse_sim
        run: python -m pytest -m cfd -v -rs

      # Every case whose result is kept, so that a stale one can be taken
      # from here.
      - name: Solve the reference cases, keeping their results
        if: always()
        working-directory: greenhouse_sim
        run: |
          python -m greenhouse_sim.cfd tomato_compartment \
            "$RUNNER_TEMP/cases/tomato_compartment" --solve
          python -m greenhouse_sim.cfd airflow_box "$RUNNER_TEMP/cases/airflow_box" --solve
          python -m greenhouse_sim.cfd airflow_box "$RUNNER_TEMP/cases/airflow_box@open" \
            --layout open --solve

      - name: Keep the solved results and the solver's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cfd-results
          path: |
            greenhouse_sim/greenhouse_sim/cfd/results/
            ${{ runner.temp }}/cases/*/log.*
          retention-days: 14
