name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The uv every job installs with (decision 0039). Dependabot does not move
# it: it is moved by hand, here and in cfd.yml.
env:
  UV_VERSION: "0.13.0"

# A pull request's newer push stops its older run; every push to main runs
# to its end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job's timeout is about twice its longest run, so that one that hangs
# stops instead of holding a runner for GitHub's six hours.
jobs:
  # The repository checks in four jobs at once, a part of
  # `scripts/check.py` each: the three packages and the cross-package
  # checks at the root. The simulator's tests run in a process per core.
  check:
    name: repository checks (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every part runs to its end, so that one run shows every failure.
      fail-fast: false
      matrix:
        part: [protocol, sim, adapters, root]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv, which installs the Python that .python-version names, and the
      # workspace at the versions uv.lock pins (decision 0039).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Built and installed as wheels, as a user would get them. A lockfile
      # that no longer matches the pyproject.toml files fails here.
      - name: Install the packages and tools
        run: uv sync --locked --no-editable

      - name: Run canonical repository checks
        run: uv run --no-sync python scripts/check.py --only ${{ matrix.part }}

  # The four parts as the one check the `main` ruleset requires.
  checks:
    name: repository checks
    if: always()
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success

  lowest:
    name: lowest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      # The protocol and the adapters with each of their own dependencies at
      # the lowest version their metadata allows, so that a floor below what
      # the code needs fails here rather than for a user (AUDIT.24); pytest
      # at the workspace's pin.
      - name: Install the packages at their lowest dependencies
        run: |
          uv venv
          uv pip install --resolution lowest-direct \
            ./greenhouse_protocol ./greenhouse_adapters \
            "$(uv export --frozen --only-group dev --no-hashes | grep '^pytest==')"

      - name: Test them
        run: |
          (cd greenhouse_protocol && ../.venv/bin/python -m pytest -q)
          (cd greenhouse_adapters && ../.venv/bin/python -m pytest -q)

  viewer:
    name: viewer checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: greenhouse_sim/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: greenhouse_sim/web/.nvmrc
          cache: npm
          cache-dependency-path: greenhouse_sim/web/package-lock.json

      - name: Install the viewer's dependencies
        run: npm ci

      - name: Format and lint
        run: npx biome ci .

      - name: Type-check
        run: npm run typecheck

      # Their coverage may not fall below its thresholds (decision 0030).
      - name: Unit tests and their coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  # The browser tests, in lanes that run at once, each on a machine of its
  # own with a simulator of its own (decision 0032). A lane is named for the
  # stage of `playwright.config.ts` it starts at; the configuration refuses
  # a lane it does not cut, and runs none unless all of them are here.
  browser:
    name: browser tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every lane runs to its end, so that one run shows every failure.
      fail-fast: false
      matrix:
        lane: [chromium, renderer-smoke, weather-day, crop]
    defaults:
      run:
        working-directory: greenhouse_sim/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: greenhouse_sim/web/.nvmrc
          cache: npm
          cache-dependency-path: greenhouse_sim/web/package-lock.json

      - name: Install the viewer's dependencies
        run: npm ci

      # The browser tests serve the simulator's API, so they need the Python
      # packages, installed as wheels as in the repository checks.
      # uv, which installs the Python that .python-version names, and the
      # workspace at the versions uv.lock pins (decision 0039).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the simulator
        working-directory: .
        run: uv sync --locked --no-editable --no-dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
          BROWSER_TEST_LANE: ${{ matrix.lane }}
          BROWSER_TEST_LANES: ${{ strategy.job-total }}

      # The failed tests' traces and screenshots: what each did, step by
      # step, with its requests and the page as it stood.
      - name: Keep the failed tests' traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces-${{ matrix.lane }}
          path: greenhouse_sim/web/test-results
          retention-days: 7

  visual:
    name: visual checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Screenshots are compared in a pinned image, so the fonts and software
    # renderer that drew the baselines are the ones that check them (decision
    # 0014). Its version moves with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble-amd64
    defaults:
      run:
        working-directory: greenhouse_sim/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: greenhouse_sim/web/.nvmrc
          cache: npm
          cache-dependency-path: greenhouse_sim/web/package-lock.json

      - name: Install the viewer's dependencies
        run: npm ci

      - name: Compare the renderer's screenshots
        run: npm run e2e:visual

      # What was drawn, and how it differs from the baseline. An intended
      # change takes its new baseline from here.
      - name: Keep the screenshots of a failed comparison
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-results
          path: greenhouse_sim/web/test-results
          retention-days: 14

  # The pull request risk gate lives in pr-risk.yml, so that it also runs
  # when the pull request description is edited.

  dco:
    name: commits are signed off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          missing=$(git log --format='%H %s%n%b%n--end--' \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" |
            awk '/^[0-9a-f]{40} /{sha=$1; signed=0} /^Signed-off-by: /{signed=1} /^--end--$/{if(!signed) print sha}')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (see CONTRIBUTING.md):"; echo "$missing"; exit 1
          fi
