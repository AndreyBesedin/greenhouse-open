name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Built and installed as wheels, as a user would get them.
      - name: Install the packages and tools
        run: >-
          python -m pip install
          ./greenhouse_protocol ./greenhouse_sim ./greenhouse_adapters
          -r requirements-dev.txt

      - name: Run canonical repository checks
        run: python scripts/check.py

  viewer:
    name: viewer checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greenhouse_sim/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: greenhouse_sim/web/.nvmrc
          cache: npm
          cache-dependency-path: greenhouse_sim/web/package-lock.json

      - name: Install the viewer's dependencies
        run: npm ci

      - name: Format and lint
        run: npx biome ci .

      - name: Type-check
        run: npm run typecheck

      # Their coverage may not fall below its thresholds (decision 0030).
      - name: Unit tests and their coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  # The browser tests, in lanes that run at once, each on a machine of its
  # own with a simulator of its own (decision 0032). A lane is named for the
  # stage of `playwright.config.ts` it starts at; the configuration refuses
  # a lane it does not cut, and runs none unless all of them are here.
  browser:
    name: browser tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      # Every lane runs to its end, so that one run shows every failure.
      fail-fast: false
      matrix:
        lane: [chromium, renderer-smoke, weather-day, crop]
    defaults:
      run:
        working-directory: greenhouse_sim/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: greenhouse_sim/web/.nvmrc
          cache: npm
          cache-dependency-path: greenhouse_sim/web/package-lock.json

      - name: Install the viewer's dependencies
        run: npm ci

      # The browser tests serve the simulator's API, so they need the Python
      # packages, installed as wheels as in the repository checks.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the simulator
        run: python -m pip install ../../greenhouse_protocol ..

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e
        env:
          BROWSER_TEST_LANE: ${{ matrix.lane }}
          BROWSER_TEST_LANES: ${{ strategy.job-total }}

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.lane }}
          path: greenhouse_sim/web/playwright-report
          retention-days: 7

  visual:
    name: visual checks
    runs-on: ubuntu-latest
    # Screenshots are compared in a pinned image, so the fonts and software
    # renderer that drew the baselines are the ones that check them (decision
    # 0014). Its version moves with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble-amd64
    defaults:
      run:
        working-directory: greenhouse_sim/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: greenhouse_sim/web/.nvmrc
          cache: npm
          cache-dependency-path: greenhouse_sim/web/package-lock.json

      - name: Install the viewer's dependencies
        run: npm ci

      - name: Compare the renderer's screenshots
        run: npm run e2e:visual

      # What was drawn, and how it differs from the baseline. An intended
      # change takes its new baseline from here.
      - name: Keep the screenshots of a failed comparison
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-results
          path: greenhouse_sim/web/test-results
          retention-days: 14

  # The pull request risk gate lives in pr-risk.yml, so that it also runs
  # when the pull request description is edited.

  dco:
    name: commits are signed off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          missing=$(git log --format='%H %s%n%b%n--end--' \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" |
            awk '/^[0-9a-f]{40} /{sha=$1; signed=0} /^Signed-off-by: /{signed=1} /^--end--$/{if(!signed) print sha}')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (see CONTRIBUTING.md):"; echo "$missing"; exit 1
          fi
