[project]
name = "greenhouse-adapters"
version = "0.1.0"
description = "Reproducible adapters from recorded greenhouse datasets to canonical records"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "greenhouse-protocol>=0.1.0,<0.2",
    "pydantic>=2.9",
    "openpyxl>=3.1.5,<4.0.0",
    "httpx>=0.27",
]

[project.scripts]
greenhouse-data = "greenhouse_adapters.cli:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["greenhouse_adapters", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: slower tests excluded from the pre-commit fast pass",
]
