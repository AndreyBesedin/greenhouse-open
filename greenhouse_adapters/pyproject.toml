[project]
name = "greenhouse-adapters"
version = "0.3.0"
description = "Reproducible adapters from recorded greenhouse datasets to canonical records"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "greenhouse-protocol>=0.3.0,<0.4",
    "pydantic>=2.12.2",
    "openpyxl>=3.1.5,<4.0.0",
    "httpx>=0.27",
]

[project.scripts]
greenhouse-data = "greenhouse_adapters.cli:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# A range is written as a number line (`low < value < high`), and a named
# constant is compared with the number it should be: SIM300 would turn
# both around.
ignore = ["SIM300"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["greenhouse_adapters", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: slower tests excluded from the pre-commit fast pass",
]
