minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # Standard library only, so it runs in pre-commit's own environment.
      - id: named-constants
        name: numbers in package source are named
        entry: python scripts/check_named_constants.py
        language: python
        types: [python]
        files: ^greenhouse_(protocol|sim|adapters)/greenhouse_(protocol|sim|adapters)/

      # The viewer's own Biome, so the hook and the lockfile always agree on
      # its version. Run `npm ci` in greenhouse_sim/web before committing
      # viewer changes.
      - id: biome
        name: biome format and lint (viewer)
        entry: >-
          greenhouse_sim/web/node_modules/.bin/biome check --write
          --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        files: ^greenhouse_sim/web/
        exclude: ^greenhouse_sim/web/package-lock\.json$

      - id: fast-project-checks
        name: fast repository checks
        entry: python scripts/check.py --fast
        language: system
        pass_filenames: false
        stages: [pre-push]
